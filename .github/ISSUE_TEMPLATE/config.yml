blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/ri7in/myslt-alerts/security/advisories/new
    about: >-
      Found a vulnerability? Report it privately through GitHub Security Advisories rather than
      opening a public issue. See SECURITY.md for what is in scope.

  - name: MySLT API reference
    url: https://github.com/ri7in/myslt-alerts/blob/main/docs/myslt-api.md
    about: >-
      Questions about the MySLT endpoints, headers, response fields or error bodies are usually
      answered in docs/myslt-api.md. Read it first; if the API has changed, open a MySLT API
      change issue.
